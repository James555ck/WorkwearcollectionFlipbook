<!doctype html>
<html lang="en">
<head>

<title>Cottonridge Workwear Collection 2027</title>
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="intro" id="intro">
  <img src="assets/logo.png" alt="Cottonridge Workwear Collection">
  <h1>Workwear Collection 2027</h1>
  <p>Browse the full range, zoom into the detail and download a copy to keep.</p>
  <button class="btn primary" id="enter" type="button">View the collection</button>
  <small>A TGI Corporation brand</small>
</div>

<header class="topbar">
  <div class="brand">
    <img src="assets/logo.png" alt="Cottonridge Workwear Collection">
    <span class="tag">Workwear Collection 2027</span>
  </div>
  <div class="tools">
    <button class="btn opt" id="fs" type="button">Full screen</button>
    <a class="btn opt" href="https://cottonridge.co.uk" target="_blank" rel="noopener">View range online</a>
    <a class="btn opt site-only" href="downloads/Cottonridge-Workwear-Collection-flipbook.html" download>Download flipbook (HTML)</a>

  </div>
</header>

<main class="stage" id="stage">
  <button class="nav prev" id="prev" aria-label="Previous page" disabled>&#8249;</button>
  <div class="bookwrap" id="bookwrap"><div id="zoomer"></div></div>
  <button class="nav next" id="next" aria-label="Next page">&#8250;</button>
  <div class="zoomctl" role="group" aria-label="Zoom">
    <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
    <span class="zv" id="zv">100%</span>
    <button type="button" id="zin" aria-label="Zoom in">+</button>
    <button type="button" id="zreset" aria-label="Reset zoom">&#10530;</button>
  </div>
  <div class="status" id="status">Loading brochure&hellip;</div>
</main>

<div class="thumbs" id="thumbs" aria-label="Page thumbnails"></div>

<footer class="bar">
  <div class="left">
    <span class="count" id="count">Page 1 of 16</span>
    <button class="link" id="thumbtoggle" type="button">Show all pages</button>
  </div>
  <div class="contact">
    <a href="mailto:salesteam@cottonridge.co.uk">salesteam@cottonridge.co.uk</a>
    <a href="tel:+441543278558">01543 278 558</a>
  </div>
</footer>

<script src="lib/page-flip.browser.js"></script>
<script src="app.js?v=4"></script>
